name: CI

on:
  push:
  pull_request:

jobs:
  plugin:
    name: Wrapper contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate the manifest and thin-client boundary
        run: python -m unittest discover -s tests -v

  manifest:
    name: Omarchy manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required fields and entry points
        run: |
          set -euo pipefail
          jq -e '
            .schemaVersion == 1 and
            .id == "sphiment.omavcam" and
            .name == "omavcam" and
            (.kinds | index("bar-widget")) != null and
            (.entryPoints.barWidget | type) == "string"
          ' manifest.json >/dev/null
          entry_point=$(jq -r '.entryPoints.barWidget' manifest.json)
          [[ $entry_point != /* && $entry_point != *".."* && -f $entry_point ]]
          link=$(find . -name .git -prune -o -type l -print -quit)
          [[ -z $link ]] || { echo "symlinks are not allowed: $link"; exit 1; }
